
services:
  api:
    build: .
    image: cloud-document-intelligence:local
    env_file:
      - .env
    environment:
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: .
    image: cloud-document-intelligence:local
    command:
      - streamlit
      - run
      - frontend.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf-cache:
